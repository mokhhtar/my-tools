<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Mokhtar's Tools</title>
  <meta name="description" content="A personal toolkit for everyday tasks" />
  <meta name="author" content="Mokhtar" />

  <!-- SEO -->
  <meta property="og:title" content="Home — Mokhtar's Tools" />
  <meta property="og:description" content="A personal toolkit for everyday tasks" />
  <meta property="og:url" content="http://localhost:4000/my-tools/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="/my-tools/assets/css/main.css" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e8722a'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='white'>⚙</text></svg>" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="/my-tools/" class="logo-link">
        <span class="logo-icon"><i class="ti ti-tools" aria-hidden="true"></i></span>
        <div class="logo-text">
          <span class="logo-title">DevToolbox</span>
          <span class="logo-sub">by Mokhtar</span>
        </div>
      </a>
    </div>

    <nav class="sidebar-nav" aria-label="Tools navigation">
      <p class="nav-label">TOOLS</p>
      
    </nav>

    <div class="sidebar-footer">
      <a href="https://github.com/mokhhtar" target="_blank" rel="noopener" class="footer-link">
        <i class="ti ti-brand-github" aria-hidden="true"></i> mokhhtar
      </a>
    </div>
  </aside>

  <!-- Mobile header -->
  <header class="mobile-header">
    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
    </button>
    <span class="mobile-title">DevToolbox</span>
  </header>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="overlay" aria-hidden="true"></div>

  <!-- Main content -->
  <main class="main-content">
    <section class="home-hero">
  <p class="eyebrow">Personal Toolkit</p>
  <h1>Tools built for<br><span class="accent">real workflows.</span></h1>
  <p>A growing collection of utilities for data wrangling, content processing, and developer tasks — all running in your browser, no server required.</p>
</section>

<section>
  <p class="section-title">Available Tools</p>
  <div class="tools-grid">

    

  </div>
</section>

  </main>

  <script>
    const burger = document.getElementById('burger');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('visible');
      burger.setAttribute('aria-expanded', 'true');
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('visible');
      burger.setAttribute('aria-expanded', 'false');
    }

    burger.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
  </script>
</body>
</html>
