title: "Mokhtar's Tools"
description: "A personal toolkit for everyday tasks"
url: "https://mokhhtar.github.io"
baseurl: "/my-tools"
author: "Mokhtar"

# Build settings
markdown: kramdown
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Sass
sass:
  sass_dir: assets/css
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md

# Collections
collections:
  tools:
    output: true
    permalink: /tools/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "tools"
    values:
      layout: "tool"

# Navigation (tools registry)
tool_registry:
  - id: reddit-to-json
    name: "Reddit → JSON"
    slug: "reddit-to-json"
    icon: "ti-brand-reddit"
    description: "Convert any Reddit post with its comments into a clean, structured JSON file."
    category: "Data"
    status: "stable"
  - id: video-downloader
    name: "Video Downloader"
    slug: "video-downloader"
    icon: "ti-brand-youtube"
    description: "Download videos & audio from YouTube, Twitter, TikTok, and 1000+ sites — choose quality, format, and track progress live."
    category: "Media"
    status: "stable"
  - id: link-analyzer
    name: "Link Analyzer"
    slug: "link-analyzer"
    icon: "ti-link"
    description: "Extract and check all links on any page for SEO issues and broken statuses."
    category: "SEO"
    status: "stable"
  - id: coming-soon-1
    name: "Coming Soon"
    slug: ""
    icon: "ti-dots"
    description: "Another tool is on its way."
    category: "—"
    status: "soon"
  - id: hair-visualizer
    name: "AI Hair Visualizer"
    slug: "hair-visualizer"
    icon: "ti-sparkles"
    description: "See how you'd look with any haircut or product style. Upload a photo and let AI show you the result in seconds."
    category: "AI"
    status: "stable"
